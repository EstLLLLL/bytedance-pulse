name: Deploy public site

on:
  push:
    branches: [main]
    paths:
      - "app/globals.css"
      - "data/reports.json"
      - "public/favicon.svg"
      - "public/og.png"
      - "scripts/build-static-site.mjs"
      - "static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/configure-pages@v5
      - name: Build the static report site
        run: node scripts/build-static-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
