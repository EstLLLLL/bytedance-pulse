name: Daily ByteDance monitor

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-bytedance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check cloud research credential
        id: credential
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
        run: |
          if [ -n "$ARK_API_KEY" ] && [ -n "$ARK_MODEL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ARK_API_KEY or ARK_MODEL has not been configured; skipping today's cloud run."
          fi
      - name: Research and update the public report database
        if: steps.credential.outputs.configured == 'true'
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
        run: node scripts/cloud-monitor.mjs
      - name: Save the new daily report
        if: steps.credential.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "Update ByteDance report"
            git push
          fi
